# ============================================================
# StudySync AI — application.properties (Phase 3)
# ============================================================

server.port=8080
spring.application.name=StudySync-AI
app.name=StudySync AI

# ─── H2 In-Memory Database ───────────────────────────────────
spring.datasource.url=jdbc:h2:mem:studysyncdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA ─────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ─── JWT ─────────────────────────────────────────────────────
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# ─── Google OAuth2 ───────────────────────────────────────────
# HOW TO GET THESE:
#   1. Go to https://console.cloud.google.com
#   2. Create a project → APIs & Services → Credentials
#   3. Create OAuth 2.0 Client ID (Web application)
#   4. Add Authorized redirect URI:
#      http://localhost:8080/oauth2/callback/google
#   5. Copy Client ID and Client Secret below
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/{registrationId}

# Where to redirect the frontend after OAuth2 login succeeds/fails
app.oauth2.redirect-uri=http://localhost:3000/oauth-callback

# ─── Email / SMTP ────────────────────────────────────────────
# For development: use Mailtrap (https://mailtrap.io) — free fake SMTP inbox
# For production:  swap with SendGrid, AWS SES, or Mailgun credentials
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=YOUR_MAILTRAP_USERNAME
spring.mail.password=YOUR_MAILTRAP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
